function compute(games){
  const P={};ROSTER.forEach(([n,name,pos])=>P[n]={n,name,pos,gp:0,g:0,a:0,a1:0,a2:0,pm:0,ppg:0,ppa:0,shg:0,sha:0,gwg:0,esgf:0,esga:0,pl:0,mi:0,log:[]});
  for(const gm of games){
    const line={};ROSTER.forEach(([n])=>{if(!(gm.dnp||[]).includes(n)){P[n].gp++;line[n]={g:0,a:0,pm:0,pp:0}}});
    let mg=0;
    for(const [side,str,g,a1,a2,ice] of gm.ev){
      if(side==="M"){mg++;
        const gw=gm.res==="W"&&mg===gm.ga+1;
        if(g){P[g].g++;line[g].g++;if(str==="PP"){P[g].ppg++;line[g].pp++}if(str==="SH")P[g].shg++;if(gw)P[g].gwg++}
        [[a1,"a1"],[a2,"a2"]].forEach(([a,k])=>{if(a){P[a].a++;P[a][k]++;line[a].a++;if(str==="PP"){P[a].ppa++;line[a].pp++}if(str==="SH")P[a].sha++}});
        if(ice&&str!=="PP")ice.forEach(n=>{P[n].pm++;P[n].pl++;line[n].pm++;if(str==="ES")P[n].esgf++});
      }else if(ice&&str!=="PP")ice.forEach(n=>{P[n].pm--;P[n].mi++;line[n].pm--;P[n].esga++});
    }
    for(const n in line)P[n].log.push({n:gm.n,...line[n]});
  }
  return P;
}

  h+=`<div class="tw"><table><thead><tr><th class="l">Team</th><th>Rating</th><th class="l">Strength</th><th class="l">Results</th></tr></thead><tbody>`;
  h+=`<tr class="me"><td class="l"><b>Chicago Mission</b></td><td><input class="rt" type="number" step="0.01" data-m="1" value="${mRating}" aria-label="Chicago Mission rating"></td><td class="l str">Baseline</td><td class="l">${rec(GAMES)}</td></tr>`;
  opps.forEach(o=>{const gs=GAMES.filter(g=>g.opp===o);h+=`<tr><td class="l">${esc(o)}</td><td><input class="rt" type="number" step="0.01" data-o="${esc(o)}" value="${ratings[o]}" aria-label="${esc(o)} rating"></td><td class="l"><span class="chip ${tierOf(ratings[o],mRating)}">${tierOf(ratings[o],mRating)}</span></td><td class="l">${gs.map(g=>`<a class="link" href="#game/${g.n}"><span class="res ${g.res}">${g.so?"SOL":g.ot?"OTW":g.res}</span> ${g.gf}–${g.ga}</a>`).join(", ")}</td></tr>`});
  h+=`</tbody></table></div><p style="margin-top:12px"><button class="plain" id="resetR">Reset to Oct 24 ratings</button></p>`;
  return h;
}
function render(){
  const hsh=location.hash.slice(1)||"team";const [v,arg]=hsh.split("/");
  const all=teamLine(GAMES);
  document.getElementById("score").innerHTML=`<div><b>${rec(GAMES)}</b><span>Record</span></div><div><b>${all.gf}</b><span>GF</span></div><div><b>${all.ga}</b><span>GA</span></div><div><b>${GAMES.length}</b><span>GP</span></div>`;
  const navV=v==="player"||v==="drill"?"players":v==="game"?"games":v;
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===navV));
  setBar(v==="game"||v==="opponents"?"game":v);
  const app=document.getElementById("app");
  app.innerHTML=v==="drill"?vDrill(+arg,hsh.split("/")[2]):v==="players"?vPlayers():v==="player"?vPlayer(+arg):v==="games"?vGames():v==="game"?vGame(+arg):v==="opponents"?vOpp():vTeam();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tier]");if(t){tier=t.dataset.tier;render();return}
  if(e.target.closest("#pickBtn")){pickOpen=!pickOpen;render();return}
  const q=e.target.closest("[data-q]");if(q){const k=q.dataset.q,ns=GAMES.map(g=>g.n);
    if(k==="close")pickOpen=false;
    else if(k==="all")excl=new Set();
    else if(k==="none")excl=new Set(ns);
    else if(k==="l5"||k==="l10"){const keep=new Set(ns.slice(-(k==="l5"?5:10)));excl=new Set(ns.filter(x=>!keep.has(x)))}
    else{excl=new Set(GAMES.filter(g=>tierG(g)!==k).map(g=>g.n));tier="All"}
    saveExcl();render();return}
  const p=e.target.closest("[data-pos]");if(p){posF=p.dataset.pos;render();return}
  const s=e.target.closest("[data-sort]");if(s){const k=s.dataset.sort;if(k===sortK)sortAsc=!sortAsc;else{sortK=k;sortAsc=false}render();return}
  if(e.target.id==="resetR"){ratings=Object.assign({},OPP);mRating=MISSION_RATING;save("mission.ratings",{});save("mission.mrating",MISSION_RATING);render();return}
  const r=e.target.closest("tr[data-href]");if(r&&!e.target.closest("a")){location.hash=r.dataset.href}
});
document.addEventListener("keydown",e=>{const s=e.target.closest&&e.target.closest("[data-sort]");if(s&&(e.key==="Enter"||e.key===" ")){e.preventDefault();s.click()}});
document.addEventListener("change",e=>{const c=e.target;if(c.dataset&&c.dataset.g){const n=+c.dataset.g;c.checked?excl.delete(n):excl.add(n);saveExcl();render();return}
  const i=e.target;if(!i.classList.contains("rt"))return;const v=parseFloat(i.value);if(isNaN(v))return;
  if(i.dataset.m){mRating=v;save("mission.mrating",v)}else{ratings[i.dataset.o]=v;const d={};for(const k in ratings)if(ratings[k]!==OPP[k])d[k]=ratings[k];save("mission.ratings",d)}render()});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
</script>
